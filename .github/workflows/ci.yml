# Continuous Integration — runs on every push and pull request.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Quality checks
  check:
    name: Quality checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dev deps
        run: uv sync --all-groups --all-extras

      # Format, import order, lint, types, security. Changes no file.
      - name: Python checks
        run: uv run just verify

      # Every git hook on every file; fails if a hook would change a file.
      # Biome is skipped here because the ui job runs it.
      - name: Git hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: biome-check

  # Web UI: lint, type-check + build, unit tests, end-to-end tests in Chromium
  # against the fake backend (no Python server needed), then the demo smoke test.
  ui:
    name: UI checks and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The same build that publish.yml puts in the wheel.
      - name: Type-check and build
        run: npm run build:backend

      - name: Unit tests
        run: npm run test

      - name: Install Chromium for Playwright
        run: npx playwright install chromium --with-deps

      - name: End-to-end tests
        run: npm run test:e2e

      # Builds the GitHub Pages demo into dist/ and smoke-tests it with `vite preview`.
      - name: Demo smoke test
        run: npm run test:demo

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 14

  # Fast tier: unit + SQLite-backed
  test-fast:
    name: Fast tier (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dev deps
        run: uv sync --all-groups --all-extras

      - name: Run tests
        run: uv run just test-fast

  # Postgres tier: dialect-sensitive tests + migration guard
  test-postgres:
    name: Postgres tier
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword  # pragma: allowlist secret
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql+psycopg://testuser:testpassword@localhost:5432/testdb"  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dev deps
        run: uv sync --all-groups --all-extras

      - name: Verify Postgres is reachable
        run: |
          uv run python - <<'EOF'
          import sys
          import psycopg

          try:
              with psycopg.connect(
                  "postgresql://testuser:testpassword@localhost:5432/testdb",
                  connect_timeout=10,
              ) as conn:
                  conn.execute("SELECT 1")
          except Exception as exc:
              print(f"ERROR: database connection failed — {exc}", file=sys.stderr)
              sys.exit(1)
          EOF

      - name: Run tests
        run: uv run just test-postgres db_host=localhost
