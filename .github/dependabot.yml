version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 100
    commit-message:
      prefix: ci
    groups:
      dev-dependencies:
        patterns:
          - "pytest"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 100
    commit-message:
      prefix: ci
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    commit-message:
      prefix: ci
    groups:
      ui-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
