# https://pre-commit.com
# https://pre-commit.com/hooks.html

# Use the active venv Python
default_language_version:
  python: python3

# Stages wired to git events:
#   pre-commit  -> runs on every `git commit`
#   pre-push    -> runs on every `git push`
# install-hooks in justfile registers both:
#   uv run pre-commit install --hook-type=pre-push
#   uv run pre-commit install --hook-type=commit-msg
default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 'v6.0.0'
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 'v0.16.3'
    hooks:
      - id: ruff          # lint  — commit + push
      - id: ruff-format   # format — commit + push

  # UI: Biome formats, sorts imports and lints ui/ with ui/biome.jsonc.
  # Runs inside ui/ (its config and node_modules live there) on the whole UI,
  # which takes under a second; needs `npm ci` in ui/ once.
  - repo: local
    hooks:
      - id: biome-check
        name: biome check (ui)
        entry: npm --prefix ui run format
        language: system
        files: ^ui/
        types_or: [javascript, jsx, ts, tsx, json, css]
        pass_filenames: false

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        files: \.(py|yaml|yml|md|toml|json|env|ts|tsx)$

  - repo: https://github.com/commitizen-tools/commitizen
    rev: 'v4.17.0'
    hooks:
      - id: commitizen         # validates commit message format
        stages: [commit-msg]   # only on commit-msg event, not push
